name: Harden contract repair scope

on:
  push:
    paths:
      - ".github/workflows/_contract-repair-v2.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harden planner and routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          repair = Path("src/contract_repair.py")
          replace_once(
              repair,
              '''_DEVICE_TOKEN_RE = re.compile(\n    r"(?<![A-Za-z0-9_])(?:SM|SD|TS|TC|CS|CC|[XYMSTCDRVZ])\\d+(?![A-Za-z0-9_])",\n    re.IGNORECASE,\n)\n''',
              '''_DEVICE_TOKEN_RE = re.compile(\n    r"(?<![A-Za-z0-9_])(?:SM|SD|TS|TC|CS|CC|[XYMSTCDRVZ])\\d+(?![A-Za-z0-9_])",\n    re.IGNORECASE,\n)\n_INDEXED_DEVICE_TOKEN_RE = re.compile(\n    r"(?<![A-Za-z0-9_])(?P<base>(?:SM|SD|[XYMSTCDR])\\d+)(?P<index>[VZ]\\d+)(?![A-Za-z0-9_])",\n    re.IGNORECASE,\n)\n''',
              "indexed device token regex",
          )
          replace_once(
              repair,
              '''def _devices_in_value(value):\n    return {item.upper() for item in _DEVICE_TOKEN_RE.findall(str(value or ""))}\n''',
              '''def _devices_in_value(value):\n    text = str(value or "")\n    devices = {item.upper() for item in _DEVICE_TOKEN_RE.findall(text)}\n    for match in _INDEXED_DEVICE_TOKEN_RE.finditer(text):\n        base = match.group("base").upper()\n        index = match.group("index").upper()\n        devices.update({base + index, base, index})\n    return devices\n''',
              "indexed device extraction",
          )
          replace_once(
              repair,
              '''    existing_addresses = set(features.get("devices") or [])\n    existing_addresses.update(\n        str(addr).strip().upper()\n        for addr in ((ladder or {}).get("device_comments") or {})\n        if str(addr).strip()\n    )\n    existing_addresses.update(\n        str(item).strip().upper()\n        for item in contract.get("required_devices") or []\n        if str(item).strip()\n    )\n    allowed_addresses = sorted(existing_addresses)\n''',
              '''    # Device scope follows the selected evidence rungs rather than the\n    # entire program.  This prevents the model from borrowing an unrelated\n    # address merely because that address exists elsewhere in the project.\n    existing_addresses = set()\n    allowed_rung_id_set = set(allowed_rung_ids)\n    for rung in (ladder or {}).get("rungs") or []:\n        if not isinstance(rung, Mapping):\n            continue\n        if rung.get("rung_id") is None or int(rung.get("rung_id")) not in allowed_rung_id_set:\n            continue\n        existing_addresses.update(_rung_devices(rung))\n    existing_addresses.update(\n        str(item).strip().upper()\n        for item in contract.get("required_devices") or []\n        if str(item).strip()\n    )\n    allowed_addresses = sorted(existing_addresses)\n''',
              "evidence-rung device scope",
          )

          pattern = Path("src/pattern_library.py")
          replace_once(
              pattern,
              '''        if task_type in {"generate", "edit", "repair", "debug_fix"}:\n            bundles.extend(["io_mapping", "output_ownership", "scan_semantics"])\n        if task_type in {"repair", "debug_fix"}:\n            bundles.append("debugging")\n''',
              '''        if task_type in {"generate", "edit", "repair", "debug_fix", "contract_repair"}:\n            bundles.extend(["io_mapping", "output_ownership", "scan_semantics"])\n        if task_type in {"repair", "debug_fix", "contract_repair"}:\n            bundles.append("debugging")\n''',
              "contract repair routing",
          )

          test_path = Path("tests/test_contract_repair_planner.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = "def test_indexed_devices_are_enforced_by_patch_scope():"
          if marker not in test_text:
              test_text += '''\n\ndef test_indexed_devices_are_enforced_by_patch_scope():\n    partial = {\n        "mode": "partial",\n        "rungs": [\n            {\n                "rung_id": 1,\n                "header_element": None,\n                "shared_inputs": [],\n                "branches": [\n                    {\n                        "branch_id": 1,\n                        "y_offset_level": 0,\n                        "inputs": [{"type": "NO", "address": "X0"}],\n                        "outputs": [\n                            {\n                                "type": "APP_INSTR",\n                                "opcode": "MOV",\n                                "operands": ["D0", "D100Z0"],\n                            }\n                        ],\n                    }\n                ],\n            }\n        ],\n    }\n    addresses = patch_device_addresses(partial)\n    assert {"X0", "D0", "D100Z0", "D100", "Z0"}.issubset(addresses)\n\n\ndef test_contract_repair_router_gets_repair_safety_bundles():\n    source = Path("src/pattern_library.py").read_text(encoding="utf-8")\n    assert '"contract_repair"' in source\n    assert '"repair", "debug_fix", "contract_repair"' in source\n'''
              test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Syntax check
        run: python -m py_compile src/contract_repair.py src/pattern_library.py tests/test_contract_repair_planner.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused tests
        run: pytest -q tests/test_contract_repair_planner.py tests/test_contract_conflict_resolution.py tests/test_instruction_registry.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contract_repair.py src/pattern_library.py tests/test_contract_repair_planner.py
          git commit -m "fix: harden evidence-bound contract repair scope"
          git push origin HEAD:main
