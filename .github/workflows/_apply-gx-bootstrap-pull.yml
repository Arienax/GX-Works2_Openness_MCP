name: Apply GX bootstrap pull

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/_patch_gx_bootstrap_pull.py'
      - 'tools/_fix_gx_bootstrap_tests.py'
      - '.github/workflows/_apply-gx-bootstrap-pull.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Apply patch
        run: |
          python tools/_patch_gx_bootstrap_pull.py
          python tools/_fix_gx_bootstrap_tests.py
      - name: Syntax check
        run: python -m py_compile src/main.py src/gxworks2/sync_service.py src/gxworks2/api.py src/gxworks2/__init__.py tests/test_gxworks2_simple_bridge_ui.py
      - name: Run focused regressions
        run: python -m pytest -q tests/test_gxworks2_simple_bridge_ui.py tests/test_gxworks2_sync.py -k 'bootstrap or snapshot or simple_gx_bridge_actions or external_modification or direct_pull or pull_button'
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Arienax@users.noreply.github.com"
          git add src/main.py src/gxworks2/sync_service.py src/gxworks2/api.py src/gxworks2/__init__.py tests/test_gxworks2_simple_bridge_ui.py tests/test_gxworks2_sync.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: bootstrap projects from GX Works2"
            git push origin HEAD:main
          fi
