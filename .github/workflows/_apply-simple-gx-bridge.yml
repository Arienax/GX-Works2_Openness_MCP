name: Apply simplified GX bridge UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/_patch_simple_gx_bridge.py'
      - '.github/workflows/_apply-simple-gx-bridge.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/_patch_simple_gx_bridge.py
      - name: Syntax check
        run: python -m py_compile src/main.py src/gxworks2/import_service.py
      - name: Run focused regression
        run: python -m pytest -q tests/test_gxworks2_simple_bridge_ui.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.py src/gxworks2/import_service.py tests/test_gxworks2_simple_bridge_ui.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: simplify GX Works2 bridge actions"
            git push origin HEAD:main
          fi
