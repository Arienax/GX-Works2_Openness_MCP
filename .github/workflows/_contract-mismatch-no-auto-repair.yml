name: Apply contract mismatch repair routing fix

on:
  push:
    paths:
      - ".github/workflows/_contract-mismatch-no-auto-repair.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch
        run: python tools/_patch_contract_repair_policy.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Syntax check
        run: python -m py_compile src/plc_json_validator.py src/main.py tests/test_contract_repair_policy.py
      - name: Run focused tests
        run: pytest -q tests/test_contract_repair_policy.py tests/test_contract_conflict_resolution.py tests/test_instruction_registry.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plc_json_validator.py src/main.py tests/test_contract_repair_policy.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "fix: skip auto repair for contract mismatches"
          git push origin HEAD:main
