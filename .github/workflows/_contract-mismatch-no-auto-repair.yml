import pytest

from plc_json_validator import (
    ApproachContractValidationError,
    PLCJsonValidationError,
    should_auto_repair_validation_error,
    validate_ladder_full,
)


def _direct_ladder():
    return {
        "device_comments": {"X0": "启动", "Y0": "输出"},
        "rungs": [
            {
                "rung_id": 1,
                "header_element": None,
                "shared_inputs": [],
                "branches": [
                    {
                        "branch_id": 1,
                        "y_offset_level": 0,
