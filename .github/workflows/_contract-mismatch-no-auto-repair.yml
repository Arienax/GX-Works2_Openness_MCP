name: Apply contract mismatch repair routing fix

on:
  push:
    paths:
      - ".github/workflows/_contract-mismatch-no-auto-repair.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = Path("src/plc_json_validator.py")
          replace_once(
              validator,
              '''class PLCJsonValidationError(ValueError):
