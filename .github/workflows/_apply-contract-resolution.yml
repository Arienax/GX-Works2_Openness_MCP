name: Apply contract conflict resolution

on:
  push:
    paths:
      - ".github/workflows/_apply-contract-resolution.yml"
      - "tools/_patch_contract_resolution.py"
      - "tests/test_contract_conflict_resolution.py"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic source patch
        run: python tools/_patch_contract_resolution.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Syntax-check implementation
        run: python -m py_compile src/approach_contracts.py
      - name: Run contract conflict tests
        run: pytest -q tests/test_contract_conflict_resolution.py
      - name: Commit implementation
        run: |
          if git diff --quiet -- src/approach_contracts.py; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/approach_contracts.py
          git commit -m "fix: resolve generation contract constraint conflicts"
          git push origin HEAD:main
