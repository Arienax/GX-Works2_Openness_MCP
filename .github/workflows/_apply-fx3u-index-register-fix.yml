name: Apply FX3U index register fix

on:
  push:
    paths:
      - ".github/workflows/_apply-fx3u-index-register-fix.yml"
      - "tools/_patch_fx3u_index_registers.py"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic source patch
        run: python tools/_patch_fx3u_index_registers.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Syntax check touched modules
        run: >-
          python -m py_compile
          src/plc_json_validator.py
          src/plc_ir.py
          src/plc_st_renderer.py
          src/confirmed_spec.py
          src/plc_static_analyzer.py
          tests/test_index_register_operands.py
      - name: Run focused index-register regression tests
        run: pytest -q tests/test_index_register_operands.py tests/test_instruction_registry.py
      - name: Commit implementation
        run: |
          if git diff --quiet -- src/plc_json_validator.py src/plc_ir.py src/plc_st_renderer.py src/confirmed_spec.py src/plc_static_analyzer.py tests/test_index_register_operands.py; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plc_json_validator.py src/plc_ir.py src/plc_st_renderer.py src/confirmed_spec.py src/plc_static_analyzer.py tests/test_index_register_operands.py
          git commit -m "fix: support FX3U V/Z indexed operands"
          git push origin HEAD:main
